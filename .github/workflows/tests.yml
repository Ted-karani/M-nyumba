# This file tells GitHub to run all our checks every time we push code.
name: Tests

on:
  # Run on every push to every branch (Render needs to see these checks on every push)
  push:
  # Also allow running them by hand from the Actions tab
  workflow_dispatch:

# The checks only need to read the code
permissions:
  contents: read

# If a newer push arrives while an older one is still being checked, stop the older one (this saves free minutes)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend tests on the same simple database we use on the laptop
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the packages
        run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q

  # The same tests on PostgreSQL, the database the live site uses
  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mnyumba
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mnyumba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnyumba -d mnyumba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mnyumba:testpass@localhost:5432/mnyumba_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the packages
        run: pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q

  # Check that the saved migrations really match our tables (this fails if someone changes a table and forgets the migration)
  migrations:
    name: Migrations match the tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mnyumba
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: mnyumba_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnyumba -d mnyumba_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mnyumba:testpass@localhost:5432/mnyumba_migrate
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the packages
        run: pip install -r requirements.txt
      - name: Make throwaway secrets (the app needs them to start)
        run: |
          echo "SECRET_KEY=ci-secret-not-real" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Build every table from the migrations
        run: alembic upgrade head
      - name: Check the migrations match our tables
        run: alembic check
      - name: Undo everything, then build it again
        run: |
          alembic downgrade base
          alembic upgrade head

  # Check that the website's offline rules work, and that the website still builds
  frontend:
    name: Website tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the packages
        run: npm ci
      - name: Run the offline tests
        run: npm test
      - name: Build the website
        run: npm run build