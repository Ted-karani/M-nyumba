# This file checks our packages for known security problems every Monday at 8am Nairobi time.
name: Weekly security check

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Package security check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the backend packages
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check the website packages
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high